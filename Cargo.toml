[package]
name = "dbf_protection"
version = "0.2.0"
edition = "2021"
# Outil DBF (dBase IV) : remet à 0 la colonne de protection PASSWORD.
# Interface graphique native via `rfd` (sélecteur de fichier + boîtes de dialogue).

[[bin]]
name = "dbf_protection"
path = "src/main.rs"

[features]
default = ["gui"]
# `gui` tire la dépendance `rfd` (optionnelle). Sans elle, mode console.
gui = ["dep:rfd"]

[dependencies]
rfd = { version = "0.14.1", optional = true }

[profile.release]
opt-level = 2
strip = true
